name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Tests y análisis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # el modulo de go vive en core/, al lado de donde ira la app de escritorio
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      # gofmt no depende del SO, con correrlo en linux alcanza
      - name: Formato
        if: runner.os == 'Linux'
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "estos archivos no pasan gofmt:"
            echo "$sin_formato"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...
