name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Tests y análisis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formato
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "estos archivos no pasan gofmt:"
            echo "$sin_formato"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...
